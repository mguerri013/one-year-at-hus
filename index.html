<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HÜS · One Year at HÜS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f1eee6;
    --paper-2:#e3dfd5;
    --ink:#10131a;
    --ink-soft:#4a4f59;
    --electric-blue:#155cff;
    --electric-blue-deep:#0038c7;
    --hot-pink:#ff1493;
    --hot-pink-deep:#d90072;
    --gold:#b78a2d;
    --sage:#4f6658;
    --steel:#35536f;
    --violet:#63558f;
    --line: rgba(26,23,18,0.16);
    --line-strong: rgba(26,23,18,0.32);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .serif{font-family:'DM Sans', system-ui, sans-serif;}
  .mono{font-family:'DM Sans', system-ui, sans-serif; letter-spacing:0.01em;}

  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top value bar (persistent during play) ---------- */
  #valuebar{
    display:none;
    border-bottom:1px solid var(--line);
    padding:14px 28px;
    gap:22px;
    flex-wrap:wrap;
    align-items:center;
  }
  #valuebar.show{display:flex;}
  .vitem{display:flex; align-items:center; gap:8px; min-width:118px;}
  .vitem .vlabel{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); width:64px;}
  .vitem .vtrack{position:relative; width:64px; height:4px; background:var(--line); border-radius:0;}
  .vitem .vfill{position:absolute; left:0; top:0; height:100%; transition:width 900ms cubic-bezier(.2,.8,.2,1), background 400ms;}
  .vitem .vnum{font-size:11px; width:24px; text-align:right; color:var(--ink-soft);}

  /* ---------- Scene layout ---------- */
  .scene{
    flex:1;
    width:100%;
    max-width:920px;
    margin:0 auto;
    padding:56px 28px 64px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    animation:rise 640ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .scene{animation:none;}
    .vitem .vfill{transition:none;}
  }

  .eyebrow-num{
    font-size:12px; color:var(--electric-blue); margin-bottom:18px;
  }

  h1.display{
    font-family:'DM Sans', system-ui, sans-serif;
    font-weight:600;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.04;
    letter-spacing:-0.01em;
    max-width:14ch;
  }
  h2.display{
    font-family:'DM Sans', system-ui, sans-serif;
    font-weight:600;
    font-size:clamp(26px, 4.2vw, 38px);
    line-height:1.12;
    max-width:20ch;
  }
  .lede{
    font-size:17px;
    line-height:1.65;
    color:var(--ink-soft);
    max-width:56ch;
    margin-top:20px;
  }
  .lede.narrow{max-width:60ch;}

  .kicker{
    font-size:13px;
    color:var(--electric-blue);
    font-weight:500;
    margin-bottom:10px;
  }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none; border:1px solid var(--ink); background:transparent;
    color:var(--ink); font-family:'DM Sans', system-ui, sans-serif; font-size:15px; font-weight:500;
    padding:13px 26px; cursor:pointer; transition:background 180ms, color 180ms;
  }
  .btn:hover, .btn:focus-visible{background:var(--ink); color:var(--paper);}
  .btn:focus-visible{outline:2px solid var(--hot-pink); outline-offset:3px;}
  .btn.primary{background:var(--electric-blue); border-color:var(--electric-blue); color:var(--paper);}
  .btn.primary:hover{background:var(--electric-blue-deep); border-color:var(--electric-blue-deep);}
  .btn-row{margin-top:36px; display:flex; gap:14px; flex-wrap:wrap;}

  /* ---------- Institution stat grid ---------- */
  .statgrid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:0; margin-top:32px; border-top:1px solid var(--line-strong);
  }
  .stat{padding:16px 0; border-bottom:1px solid var(--line); padding-right:16px;}
  .stat .snum{font-family:'DM Sans', system-ui, sans-serif; font-size:22px; color:var(--electric-blue);}
  .stat .slabel{font-size:12px; color:var(--ink-soft); margin-top:4px;}

  /* ---------- Decision layout ---------- */
  .decision-head{border-left:3px solid var(--electric-blue); padding-left:20px; margin-bottom:8px;}
  .options{margin-top:34px; display:flex; flex-direction:column;}
  .option{
    border-top:1px solid var(--line-strong);
    padding:22px 0;
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:18px;
    align-items:start;
    cursor:pointer;
    background:none; border-right:none; border-bottom:none; border-left:none;
    text-align:left; width:100%;
    font-family:inherit;
    transition:padding-left 180ms;
  }
  .option:last-child{border-bottom:1px solid var(--line-strong);}
  .option:hover, .option:focus-visible{padding-left:10px;}
  .option:focus-visible{outline:2px solid var(--hot-pink); outline-offset:-2px;}
  .option .okey{font-family:'DM Sans', system-ui, sans-serif; font-size:20px; color:var(--electric-blue); font-weight:500;}
  .option .olabel{font-size:17px; font-weight:500; color:var(--ink);}
  .option .odesc{font-size:14.5px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
  .option .otags{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:210px;}
  .tag{font-family:'DM Sans', system-ui, sans-serif; font-size:10.5px; padding:3px 7px; border:1px solid var(--line-strong); white-space:nowrap; color:var(--ink-soft);}
  .tag.up{color:var(--sage); border-color:var(--sage);}
  .tag.down{color:var(--electric-blue); border-color:var(--electric-blue);}

  /* ---------- Consequence ---------- */
  .consequence-box{
    margin-top:30px; padding:24px 26px; background:var(--paper-2);
    border-left:3px solid var(--gold);
  }
  .consequence-box p{font-size:16px; line-height:1.6; font-style:italic; font-family:'DM Sans', system-ui, sans-serif; font-weight:400;}

  /* ---------- Turning point (inverted) ---------- */
  .scene.inverted{background:var(--ink); color:var(--paper);}
  .scene.inverted .lede{color:#c9c3b6;}
  .scene.inverted .option{border-color:rgba(233,228,216,0.22);}
  .scene.inverted .option .olabel{color:var(--paper);}
  .scene.inverted .option .odesc{color:#c9c3b6;}
  .scene.inverted .tag{border-color:rgba(233,228,216,0.3); color:#c9c3b6;}
  .scene.inverted .tag.up{color:#9fd6a8; border-color:#9fd6a8;}
  .scene.inverted .tag.down{color:#7fb2ff; border-color:#7fb2ff;}
  .scene.inverted .btn{border-color:var(--paper); color:var(--paper);}
  .scene.inverted .btn:hover{background:var(--paper); color:var(--ink);}
  .scene.inverted .btn.primary{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  .scene.inverted .consequence-box{background:rgba(233,228,216,0.08); border-left-color:var(--gold);}
  .scene.inverted .consequence-box p{color:var(--paper);}
  .scene.inverted .decision-head{border-left-color:var(--gold);}
  .scene.inverted .eyebrow-num{color:var(--gold);}

  /* ---------- Progress ---------- */
  #progress{
    position:fixed; bottom:18px; right:24px;
    font-family:'DM Sans', system-ui, sans-serif; font-size:12px; color:var(--ink-soft);
    display:none;
  }
  #progress.show{display:block;}

  /* ---------- Report screen ---------- */
  .report-title{font-family:'DM Sans', system-ui, sans-serif; font-weight:700; font-size:clamp(40px,7vw,72px); line-height:1;}
  .report-sub{font-size:16px; color:var(--electric-blue); margin-top:10px; font-weight:500;}
  .report-desc{font-size:17px; line-height:1.7; color:var(--ink-soft); max-width:58ch; margin-top:22px;}

  .radar-wrap{display:flex; gap:48px; flex-wrap:wrap; align-items:center; margin-top:44px;}
  .radar-legend{display:flex; flex-direction:column; gap:10px; min-width:200px;}
  .rlegend-item{display:flex; align-items:center; gap:10px; font-size:13px;}
  .rswatch{width:10px; height:10px; flex-shrink:0;}
  .rlegend-item .rnum{margin-left:auto; font-family:'DM Sans', system-ui, sans-serif; color:var(--ink-soft);}

  .impact-block{margin-top:48px; padding-top:32px; border-top:1px solid var(--line-strong);}
  .impact-block h3, .defining-block h3{font-family:'DM Sans', system-ui, sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; color:var(--ink-soft); margin-bottom:16px;}

  .defining-block{margin-top:44px;}
  .defmoment{border-top:1px solid var(--line); padding:18px 0;}
  .defmoment:last-child{border-bottom:1px solid var(--line);}
  .defmoment .dtitle{font-weight:600; font-size:15.5px;}
  .defmoment .dchoice{font-size:14px; color:var(--electric-blue); margin-top:3px;}
  .defmoment .dwhy{font-size:14px; color:var(--ink-soft); margin-top:6px; font-style:italic; font-family:'DM Sans', system-ui, sans-serif;}

  .profiles-block{margin-top:48px; padding-top:32px; border-top:1px solid var(--line-strong);}
  .profiles-block h3{font-family:'DM Sans', system-ui, sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; color:var(--ink-soft); margin-bottom:16px;}
  .profiles-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; margin-top:6px;}
  .profile-card{border:1px solid var(--line-strong); padding:16px 18px; position:relative;}
  .profile-card .pctitle{font-family:'DM Sans', system-ui, sans-serif; font-weight:600; font-size:17px;}
  .profile-card .psub{font-size:11.5px; color:var(--electric-blue); margin-top:2px; text-transform:uppercase; letter-spacing:.04em;}
  .profile-card .pdesc{font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}
  .profile-card.active{border-color:var(--sage); background:rgba(99,210,195,.08);}
  .profile-card.active::before{content:"YOUR PROFILE"; position:absolute; top:-9px; left:14px; background:var(--sage); color:var(--ink); font-family:'DM Sans', system-ui, sans-serif; font-size:9px; font-weight:600; padding:2px 7px; letter-spacing:.06em;}

  footer.report-footer{margin-top:56px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
  .foot-note{font-size:13px; color:var(--ink-soft); margin-top:20px; max-width:52ch; line-height:1.6;}

  a.plain{color:inherit;}

  .scene{position:relative; overflow:hidden;}
  .scene::after{content:""; position:absolute; width:180px; height:180px; right:-90px; top:-90px; border:28px solid var(--hot-pink); transform:rotate(22deg); opacity:.9; pointer-events:none;}
  .scene::before{content:""; position:absolute; width:8px; height:120px; right:54px; bottom:30px; background:var(--electric-blue); transform:rotate(28deg); opacity:.9; pointer-events:none;}
  .kicker::before{content:""; display:inline-block; width:28px; height:2px; background:var(--hot-pink); vertical-align:middle; margin-right:10px;}
  .btn.primary{box-shadow:6px 6px 0 var(--hot-pink);}
  .btn.primary:hover{box-shadow:3px 3px 0 var(--hot-pink);}
  .option .otags{opacity:.55; transform:translateX(8px);}
  .scene:not(.inverted) .option:hover .otags, .scene:not(.inverted) .option:focus-visible .otags{opacity:1; transform:translateX(0);}
  .scene.inverted::after{border-color:var(--hot-pink);}
  .scene.inverted::before{background:var(--electric-blue);}
  .scene.inverted .kicker::before{background:var(--electric-blue);}
  .scene.inverted .btn.primary{background:var(--hot-pink); border-color:var(--hot-pink); color:#10131a; box-shadow:6px 6px 0 var(--electric-blue);}
  .scene.inverted .btn.primary:hover{background:var(--hot-pink-deep); border-color:var(--hot-pink-deep);}
  .accent-note{display:inline-block; margin-top:22px; padding:8px 12px; border-left:3px solid var(--hot-pink); background:rgba(21,92,255,.07); font-size:12px; text-transform:uppercase; letter-spacing:.08em;}
  .rationale{margin-top:48px; padding:30px; background:var(--ink); color:var(--paper); position:relative; overflow:hidden;}
  .rationale::after{content:""; position:absolute; width:100px; height:100px; right:-35px; top:-35px; border:16px solid var(--hot-pink); transform:rotate(30deg);}
  .rationale h3{font-family:'DM Sans', system-ui, sans-serif; font-size:26px; font-weight:600; margin-bottom:10px;}
  .rationale p{color:#cdd2dc; line-height:1.65; max-width:60ch;}
  .rationale .rhint{margin-top:18px; color:var(--hot-pink); font-family:'DM Sans', system-ui, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.08em;}

  /* ---------- V2 visual direction: black / electric blue / hot pink ---------- */
  :root{
    --paper:#080a10;
    --paper-2:#111520;
    --ink:#f4f1e8;
    --ink-soft:#aeb5c3;
    --electric-blue:#245cff;
    --electric-blue-deep:#003de0;
    --hot-pink:#ff159d;
    --hot-pink-deep:#d90079;
    --gold:#8f96a5;
    --sage:#63d2c3;
    --steel:#77a8ff;
    --violet:#a78bfa;
    --line:rgba(244,241,232,.16);
    --line-strong:rgba(244,241,232,.30);
  }
  body{background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;}
  #valuebar{display:none !important;}
  .scene{background:var(--paper);color:var(--ink);}
  .scene::after{border-color:var(--hot-pink);}
  .scene::before{background:var(--electric-blue);}
  .lede,.report-desc,.foot-note{color:var(--ink-soft);}
  .kicker,.eyebrow-num,.report-sub,.stat .snum,.option .okey,.option .dchoice{color:var(--electric-blue);}
  h1.display,h2.display,.report-title{color:var(--ink);}
  .btn{border-color:var(--ink);color:var(--ink);}
  .btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--electric-blue);border-color:var(--electric-blue);color:#fff;box-shadow:6px 6px 0 var(--hot-pink);}
  .btn.primary:hover{background:var(--electric-blue-deep);border-color:var(--electric-blue-deep);}
  .statgrid,.option,.option:last-child,.impact-block,.defmoment{border-color:var(--line-strong);}
  .stat{border-color:var(--line);}
  .decision-head{border-left-color:var(--electric-blue);}
  .option .olabel{color:var(--ink);}
  .option .odesc{color:var(--ink-soft);}
  .option .otags{display:none;}
  .option{grid-template-columns:44px 1fr;}
  .consequence-box{background:var(--paper-2);border-left-color:var(--hot-pink);}
  .consequence-box p{color:var(--ink);}
  .accent-note{border-left-color:var(--hot-pink);background:rgba(36,92,255,.10);color:var(--ink-soft);}
  #progress{color:var(--ink-soft);}
  .scene.inverted{background:#05070d;color:var(--ink);}
  .scene.inverted .lede,.scene.inverted .option .odesc{color:var(--ink-soft);}
  .scene.inverted .option .olabel,.scene.inverted h2.display{color:var(--ink);}
  .scene.inverted .option{border-color:var(--line-strong);}
  .scene.inverted .btn{border-color:var(--ink);color:var(--ink);}
  .scene.inverted .btn:hover{background:var(--ink);color:var(--paper);}
  .scene.inverted .btn.primary{background:var(--hot-pink);border-color:var(--hot-pink);color:#05070d;box-shadow:6px 6px 0 var(--electric-blue);}
  .scene.inverted .decision-head{border-left-color:var(--hot-pink);}
  .scene.inverted .eyebrow-num{color:var(--hot-pink);}
  .scene.inverted .consequence-box{background:rgba(244,241,232,.06);border-left-color:var(--hot-pink);}
  .scene.inverted .consequence-box p{color:var(--ink);}
  .impact-block h3,.defining-block h3{color:var(--ink-soft);}
  .defmoment .dwhy{color:var(--ink-soft);}
  .rationale{background:#111520;border:1px solid var(--line-strong);}
  .rationale h3{color:var(--ink);}
  .rationale p{color:var(--ink-soft);}
  .rationale .rhint{color:var(--hot-pink);}
  .report-footer{border-top:1px solid var(--line-strong);padding-top:28px;}
  .contact-block{margin-top:48px;padding-top:28px;border-top:1px solid var(--line-strong);display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .contact-block h3{font-family:'DM Sans', system-ui, sans-serif;font-size:20px;color:var(--ink);margin-bottom:8px;}
  .contact-block p{font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .contact-block .contact-label{font-family:'DM Sans', system-ui, sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--hot-pink);margin-bottom:8px;}
  @media(max-width:620px){.contact-block{grid-template-columns:1fr;}}


.site-credit{
  margin:72px 0 0;
  padding:28px 0 8px;
  border-top:1px solid rgba(255,255,255,.14);
  text-align:center;
  font-family:'DM Sans', system-ui, sans-serif;
  color:rgba(255,255,255,.62);
  letter-spacing:.04em;
}
.credit-line{
  color:#4d8dff;
  font-size:12px;
  letter-spacing:.16em;
  font-weight:600;
}
.credit-author{
  margin-top:7px;
  color:#ff3cac;
  font-size:11px;
}
.credit-contact{
  margin-top:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  font-size:10px;
}
.credit-contact a{
  color:rgba(255,255,255,.62);
  text-decoration:none;
}
.credit-contact a:hover,
.credit-contact a:focus-visible{
  color:#ff3cac;
  text-decoration:underline;
}


.impact-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.impact-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid rgba(255,255,255,.18);border-radius:999px;font:500 10px/1 'DM Sans', system-ui, sans-serif;letter-spacing:.04em;color:rgba(255,255,255,.78)}
  /* Decision indicators: positive = green, negative = blue */
  .impact-chip.up{
    border-color:rgba(99,210,195,.60);
    color:#63d2c3;
  }
  .impact-chip.down{
    border-color:rgba(36,92,255,.60);
    color:#4d8dff;
  }
  .decision-impact{
    margin-top:26px;
    padding:18px 20px;
    border:1px solid var(--line-strong);
    background:var(--paper-2);
  }
  .decision-impact-title{
    font-family:'DM Sans', system-ui, sans-serif;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .decision-impact .impact-chips{margin-top:0}
  .current-values{
    margin-top:14px;
    font-family:'DM Sans', system-ui, sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .creator-view{
    margin-top:48px;
    padding:30px;
    background:#111520;
    border:1px solid var(--line-strong);
    cursor:pointer;
    transition:transform 180ms,border-color 180ms;
  }
  .creator-view:hover,.creator-view:focus-visible{
    transform:translateY(-2px);
    border-color:var(--hot-pink);
  }
  .creator-view .view-label{
    color:var(--hot-pink);
    font-family:'DM Sans', system-ui, sans-serif;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:10px;
  }
  .creator-view h3{
    font-family:'DM Sans', system-ui, sans-serif;
    font-size:26px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:8px;
  }
  .creator-view p{color:var(--ink-soft);line-height:1.65;max-width:62ch}
  .creator-view .view-hint{
    margin-top:18px;
    color:#4d8dff;
    font-family:'DM Sans', system-ui, sans-serif;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .creator-panel{
    margin-top:18px;
    padding:26px 30px;
    border-left:3px solid var(--hot-pink);
    background:var(--paper-2);
  }
  .creator-panel p{color:var(--ink-soft);line-height:1.7;max-width:64ch}
  .creator-panel p + p{margin-top:14px}
  .creator-panel strong{color:var(--ink)}

  .my-profile-block{margin-bottom:24px; padding-bottom:22px; border-bottom:1px solid var(--line-strong);}
  .my-profile-kicker{font-family:'DM Sans', system-ui, sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--hot-pink); margin-bottom:8px;}
  .my-profile-title{font-family:'DM Sans', system-ui, sans-serif; font-weight:700; font-size:28px; color:var(--ink); line-height:1.1;}
  .my-profile-sub{font-size:12.5px; color:#4d8dff; margin-top:4px; text-transform:uppercase; letter-spacing:.04em;}
  .my-profile-desc{margin-top:10px;}
  .my-profile-impact{margin-top:10px !important; font-style:italic; font-family:'DM Sans', system-ui, sans-serif;}

  .my-decisions-block{margin-top:26px; padding-top:22px; border-top:1px solid var(--line-strong);}
  .my-decisions-title{font-family:'DM Sans', system-ui, sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--hot-pink); margin-bottom:14px;}

  .mdchoice .mdtitle{font-weight:600; color:var(--ink); font-size:14.5px;}
  .mdchoice .mdlabel{font-size:13.5px; color:#4d8dff; margin-top:3px;}
  .mdchoice .mdconsequence{font-size:13px; color:var(--ink-soft); margin-top:5px; line-height:1.55; font-style:italic;}


  #langbar{position:fixed; top:10px; right:12px; z-index:50; display:flex; gap:4px; font-family:'DM Sans', system-ui, sans-serif;}
  #langbar button{background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong); padding:4px 8px; font:inherit; font-size:11px; letter-spacing:.06em; cursor:pointer;}
  #langbar button.on{background:var(--electric-blue); border-color:var(--electric-blue); color:#fff;}
  html[lang="fr"] .profile-card.active::before{content:"VOTRE PROFIL";}

  .home-section{margin-top:48px;}
  .home-label{font-family:'DM Sans', system-ui, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--hot-pink); margin-bottom:14px;}
  .skill-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px;}
  .skill{border:1px solid var(--line-strong); padding:18px 20px;}
  .skill b{display:block; font-family:'DM Sans', system-ui, sans-serif; font-size:19px; font-weight:600; margin-bottom:6px; color:var(--ink);}
  .skill span{font-size:14px; line-height:1.55; color:var(--ink-soft);}
  .home-section .lede{margin-top:0;}
  .scene .home-section + .btn-row{margin-top:48px;}

  /* ---------- V3 : concrete effects, icons, mobile ---------- */
  #segbar{position:fixed;top:0;left:0;right:0;height:5px;display:none;gap:3px;z-index:40;}
  #segbar.show{display:flex;}
  #segbar i{flex:1;background:rgba(244,241,232,.14);transition:background 400ms;}
  #segbar i.done{background:var(--electric-blue);}
  #segbar i.cur{background:var(--hot-pink);}
  #progress{position:fixed;top:16px;left:18px;right:auto;bottom:auto;z-index:40;}

  .geo{display:flex;gap:4px;height:12px;margin-bottom:26px;max-width:340px;}
  .geo i{display:block;transform-origin:left;animation:geoIn 700ms cubic-bezier(.2,.8,.2,1) backwards;}
  .geo i:nth-child(1){flex:5;background:var(--electric-blue);}
  .geo i:nth-child(2){flex:1.5;background:var(--hot-pink);animation-delay:80ms;}
  .geo i:nth-child(3){flex:3;background:var(--ink);animation-delay:160ms;}
  .geo i:nth-child(4){flex:1;background:var(--violet);animation-delay:240ms;}
  .geo i:nth-child(5){flex:2;background:var(--sage);animation-delay:320ms;}
  .geo i:nth-child(6){flex:1;background:var(--steel);animation-delay:400ms;}
  @keyframes geoIn{from{transform:scaleX(0);}}

  .btn{min-height:46px;}
  .options{gap:14px;}
  .options .option{border:1px solid var(--line-strong);background:var(--paper-2);padding:20px 20px;
    animation:rise 520ms backwards;animation-delay:calc(var(--i,0)*90ms + 150ms);
    transition:transform 160ms, box-shadow 160ms, border-color 160ms;}
  .options .option:last-child{border-bottom:1px solid var(--line-strong);}
  .options .option:hover,.options .option:focus-visible{padding-left:20px;transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--hot-pink);border-color:var(--ink);}
  .options .option:focus-visible{outline:2px solid var(--electric-blue);outline-offset:2px;}
  .option .okey{font-size:26px;line-height:1;}
  .scene.inverted .options .option{background:rgba(244,241,232,.05);border-color:var(--line-strong);}
  .impact-chip{padding:6px 10px;font-size:10.5px;}

  /* metric cards */
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px;}
  .mcard{position:relative;border:1px solid var(--line-strong);background:var(--paper-2);padding:16px 14px 16px;
    animation:rise 520ms backwards;animation-delay:calc(var(--i,0)*90ms + 200ms);}
  .mcard::before{content:"";position:absolute;left:-1px;top:-1px;width:20px;height:4px;background:var(--hot-pink);}
  .mlabel{font-family:'DM Sans', system-ui, sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);min-height:2.7em;line-height:1.3;}
  .mval{font-size:25px;margin-top:8px;color:var(--ink);font-weight:500;}
  .mdelta{margin-top:4px;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .mcard.up .mdelta{color:#63d2c3;}
  .mcard.down .mdelta{color:#4d8dff;}
  .mbar{position:relative;height:5px;background:var(--line);margin-top:14px;}
  .mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--electric-blue);transition:width 900ms cubic-bezier(.2,.8,.2,1);}
  .mcard.up .mbar i{background:#63d2c3;}
  .fxline{margin-top:22px;padding-left:16px;border-left:3px solid var(--electric-blue);}
  .fxline .fxlabel{font-family:'DM Sans', system-ui, sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--hot-pink);}
  .fxline p{margin-top:6px;font-size:16px;line-height:1.6;color:var(--ink);}
  details.decision-impact summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px;margin-bottom:0;}
  details.decision-impact summary::-webkit-details-marker{display:none;}
  details.decision-impact summary::after{content:"+";font-size:18px;color:var(--hot-pink);}
  details.decision-impact[open] summary::after{content:"–";}
  details.decision-impact[open] summary{margin-bottom:12px;}
  .mdfx{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.55;}
  .mdfx::before{content:"→ ";color:var(--hot-pink);}

  /* profile icons */
  .picon{display:inline-flex;flex-shrink:0;border:1px solid var(--line-strong);background:var(--paper-2);}
  .picon svg{display:block;width:100%;height:100%;}
  .picon.big{box-shadow:6px 6px 0 var(--hot-pink);}
  .picon.block{margin-bottom:14px;}
  .report-head{display:flex;align-items:center;gap:24px;flex-wrap:nowrap;}
  .pc-head{display:flex;align-items:center;gap:12px;}
  .radar-box{flex:1 1 320px;max-width:460px;min-width:0;}
  .radar-box svg{overflow:visible;}

  @media (max-width:640px){
    #langbar{top:8px;right:10px;}
    #langbar button{padding:6px 10px;font-size:12px;}
    .scene{padding:64px 18px 48px;justify-content:flex-start;}
    .scene::after{width:110px;height:110px;right:-64px;top:-64px;border-width:18px;}
    .scene::before{display:none;}
    h1.display{font-size:clamp(34px,11vw,48px);max-width:none;}
    h2.display{font-size:clamp(26px,8vw,34px);max-width:none;}
    .lede{font-size:16px;line-height:1.6;}
    .statgrid{grid-template-columns:repeat(2,1fr);}
    .options .option{grid-template-columns:28px 1fr;gap:12px;padding:16px 14px;}
    .option .olabel{font-size:16.5px;}
    .option .odesc{font-size:14.5px;}
    .impact-chip{font-size:10.5px;}
    .btn-row .btn{width:100%;text-align:center;}
    .btn.primary,.scene.inverted .btn.primary{box-shadow:4px 4px 0 var(--hot-pink);}
    .mgrid{grid-template-columns:1fr 1fr;gap:10px;}
    .mval{font-size:21px;}
    .mlabel{font-size:10px;}
    .radar-wrap{gap:20px;margin-top:30px;}
    .radar-box{flex-basis:100%;}
    .radar-legend{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
    .profiles-grid{grid-template-columns:1fr;}
    .report-head{gap:14px;}
    .report-title{font-size:clamp(32px,10.5vw,46px);}
    .picon.big{width:68px !important;height:68px !important;box-shadow:4px 4px 0 var(--hot-pink);}
    .consequence-box{padding:18px;}
    .creator-view,.creator-panel,.rationale{padding:22px 18px;}
    .decision-impact{padding:16px;}
    .current-values{font-size:11.5px;}
    .site-credit{margin-top:48px;}
  }
  @media (hover:none){
    .options .option:hover{transform:none;box-shadow:none;border-color:var(--line-strong);}
    .options .option:active{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--hot-pink);}
  }
  @media (prefers-reduced-motion: reduce){
    .geo i,.option,.mcard{animation:none !important;}
    .mbar i{transition:none;}
  }

  /* ---------- V4 : light palette  #003CFF / #000 / #FFF / #8EFF90 / #FF0099 ---------- */
  :root{
    --paper:#ffffff; --paper-2:#f2f2f2; --ink:#000000; --ink-soft:#4b4b4b;
    --electric-blue:#003cff; --electric-blue-deep:#0029b8;
    --hot-pink:#ff0099; --hot-pink-deep:#c9007a;
    --mint:#8eff90; --sage:#8eff90; --gold:#000000; --steel:#003cff; --violet:#7a3cff;
    --line:rgba(0,0,0,.14); --line-strong:rgba(0,0,0,.55);
  }
  body{background:var(--paper);transition:background 300ms;}
  body.inv{background:#000;}
  .scene.inverted{--paper:#000;--paper-2:#121212;--ink:#fff;--ink-soft:#cfcfcf;--line:rgba(255,255,255,.2);--line-strong:rgba(255,255,255,.5);background:#000;color:#fff;}
  body.inv #langbar button{color:#d0d0d0;border-color:rgba(255,255,255,.4);}
  body.inv #langbar button.on{color:#fff;border-color:var(--electric-blue);}
  body.inv #progress{color:#d0d0d0;}
  body.inv #segbar i{background:rgba(255,255,255,.2);}
  body.inv #segbar i.done{background:var(--electric-blue);}
  body.inv #segbar i.cur{background:var(--hot-pink);}
  #segbar i{background:rgba(0,0,0,.12);}
  #segbar i.done{background:var(--electric-blue);}
  #segbar i.cur{background:var(--hot-pink);}

  .accent-note,.scene.inverted .accent-note{background:var(--mint);color:#000;border-left-color:#000;}
  .scene.inverted .accent-note{border-left-color:var(--hot-pink);}
  .consequence-box{background:var(--paper-2);}

  /* home skills as colour blocks */
  .skill{border:1.5px solid #000;}
  .skill:nth-child(1){background:var(--electric-blue);} .skill:nth-child(1) b,.skill:nth-child(1) span{color:#fff;}
  .skill:nth-child(2){background:var(--mint);}          .skill:nth-child(2) b,.skill:nth-child(2) span{color:#000;}
  .skill:nth-child(3){background:var(--hot-pink);}      .skill:nth-child(3) b,.skill:nth-child(3) span{color:#000;}

  /* options */
  .options .option{background:#fff;border:1.5px solid #000;}
  .scene.inverted .options .option{background:rgba(255,255,255,.06);border-color:var(--line-strong);}
  .scene.inverted .options .option:hover,.scene.inverted .options .option:focus-visible{border-color:#fff;}

  /* chips */
  .tag{font-size:11px;padding:5px 9px;border:1px solid #000;color:#000;background:#fff;}
  .tag.up,.scene.inverted .tag.up{background:var(--mint);color:#000;border-color:#000;}
  .tag.down,.scene.inverted .tag.down{background:var(--electric-blue);color:#fff;border-color:var(--electric-blue);}
  .scene.inverted .tag.up{border-color:var(--mint);}

  /* metric cards */
  .mcard{background:var(--paper-2);border:1.5px solid var(--ink);}
  .mcard.up .mdelta,.mcard.down .mdelta{display:inline-block;padding:3px 8px;}
  .mcard.up .mdelta{background:var(--mint);color:#000;}
  .mcard.down .mdelta{background:var(--electric-blue);color:#fff;}
  .mbar{height:8px;background:transparent;border:1px solid var(--ink);}
  .mbar i{top:0;bottom:0;}
  .mcard.up .mbar i{background:var(--mint);}

  /* cards & report */
  .profile-card{border:1.5px solid #000;background:#fff;}
  .profile-card.active{border-color:#000;background:rgba(142,255,144,.30);}
  .profile-card.active::before{background:var(--mint);color:#000;border:1px solid #000;}
  .rswatch{border:1px solid #000;}
  .creator-view{background:#000;border-color:#000;}
  .creator-view h3{color:#fff;}
  .creator-view p{color:#d0d0d0;}
  .creator-view .view-hint{color:var(--mint);}
  .creator-view:hover,.creator-view:focus-visible{border-color:var(--hot-pink);}
  .creator-panel{background:var(--paper-2);}
  .creator-panel strong{color:#000;}
  .my-profile-sub,.mdchoice .mdlabel{color:var(--electric-blue);}
  .site-credit{border-top-color:rgba(0,0,0,.18);color:#555;}
  .credit-line{color:var(--electric-blue);}
  .credit-author{color:var(--hot-pink);}
  .credit-contact a{color:#444;}
  body.inv .site-credit{border-top-color:rgba(255,255,255,.18);}
  body.inv .credit-contact a{color:#ccc;}

  /* icons */
  .picon{background:#fff;border:2px solid #000;}
  .picon.big{box-shadow:6px 6px 0 var(--hot-pink);}
  .picon.city{box-shadow:4px 4px 0 var(--electric-blue);}
  .picon.sm{border-width:1.5px;box-shadow:none;}
  .scene.inverted .kicker,.scene.inverted .option .okey,.scene.inverted .stat .snum{color:var(--mint);}
  .scene.inverted .kicker::before{background:var(--hot-pink);}
  .scene.inverted .mcard::before{background:var(--mint);}
  .scene.inverted .fxline{border-left-color:var(--mint);}
  .scene.inverted .picon{border-color:#fff;}
  .dh-icon{margin-bottom:16px;}
  .dtitle,.mdtitle{display:flex;align-items:center;gap:12px;}
  .cityhero{display:block;width:100%;max-width:540px;height:auto;margin:24px 0 4px;}
  @media (max-width:640px){
    .picon.city{width:60px !important;height:60px !important;box-shadow:3px 3px 0 var(--electric-blue);}
    .picon.sm{width:34px !important;height:34px !important;}
  }

  /* ---------- V5 : soft, modern, strictly the 5-colour palette ---------- */
  :root{
    --ink:rgba(0,0,0,.86); --ink-soft:rgba(0,0,0,.58);
    --paper:#ffffff; --paper-2:rgba(0,0,0,.04);
    --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.14);
    --violet:#003cff; --steel:#003cff; --sage:#8eff90;
    --blue-soft:rgba(0,60,255,.07); --pink-soft:rgba(255,0,153,.07);
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
  }
  .scene.inverted{--ink:rgba(255,255,255,.92);--ink-soft:rgba(255,255,255,.66);--paper-2:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--line-strong:rgba(255,255,255,.22);}
  h1.display,h2.display,.report-title{font-weight:700;letter-spacing:-.028em;}
  h1.display{line-height:1.05;}
  .lede{line-height:1.7;}
  .kicker,.eyebrow-num{font-weight:600;letter-spacing:.08em;font-size:12px;}
  .kicker::before{border-radius:2px;}
  .decision-head,.scene.inverted .decision-head{border-left:none;padding-left:0;}

  /* background shapes: soft tints instead of hard frames */
  .scene::after{width:340px;height:340px;right:-170px;top:-170px;border:none;border-radius:50%;background:var(--blue-soft);transform:none;opacity:1;}
  .scene::before{display:block;width:260px;height:260px;left:-130px;bottom:-130px;right:auto;border-radius:50%;background:var(--pink-soft);transform:none;opacity:1;}
  .scene.inverted::after,.scene.inverted::before{display:none;}

  /* buttons */
  .btn{border:1.5px solid rgba(0,0,0,.8);border-radius:14px;font-weight:600;padding:14px 26px;min-height:48px;transition:background 180ms,color 180ms,box-shadow 180ms,transform 180ms;}
  .btn.primary,.scene.inverted .btn.primary{background:var(--electric-blue);border-color:var(--electric-blue);color:#fff;box-shadow:0 8px 22px rgba(0,60,255,.25);}
  .btn.primary:hover,.btn.primary:focus-visible{background:var(--electric-blue-deep);border-color:var(--electric-blue-deep);box-shadow:0 4px 14px rgba(0,60,255,.3);}
  .scene.inverted .btn{border-color:rgba(255,255,255,.45);border-radius:14px;}
  .scene.inverted .btn.primary{background:var(--mint);border-color:var(--mint);color:#000;box-shadow:none;}
  .scene.inverted .btn.primary:hover{background:#fff;border-color:#fff;}

  /* language + progress */
  #langbar button{border-radius:10px;background:#fff;border:1px solid var(--line-strong);}
  #langbar button.on{background:var(--electric-blue);border-color:var(--electric-blue);}
  body.inv #langbar button{background:transparent;}
  #segbar{height:4px;gap:4px;}
  #segbar i{border-radius:0 0 4px 4px;}

  /* options */
  .options .option{border:1px solid var(--line-strong);border-radius:18px;background:#fff;box-shadow:var(--shadow);padding:20px 22px;}
  .options .option:last-child{border-bottom:1px solid var(--line-strong);}
  .options .option:hover,.options .option:focus-visible{padding-left:22px;transform:translateY(-2px);border-color:rgba(0,60,255,.45);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(0,60,255,.12);}
  .option .okey{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:var(--electric-blue);font-weight:700;font-size:15px;}
  .scene.inverted .options .option{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);box-shadow:none;}
  .scene.inverted .options .option:hover,.scene.inverted .options .option:focus-visible{border-color:rgba(142,255,144,.7);box-shadow:none;}
  .scene.inverted .option .okey{background:rgba(255,255,255,.1);color:var(--mint);}
  .options .impact-chips{margin-top:12px;gap:6px;}
  .tag{border:none;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;background:var(--paper-2);color:var(--ink-soft);}
  .tag.up,.scene.inverted .tag.up{background:var(--mint);color:#000;border:none;}
  .tag.down{background:var(--blue-soft);color:var(--electric-blue);border:none;}
  .scene.inverted .tag.down{background:rgba(255,255,255,.14);color:#fff;border:none;}

  /* consequence */
  .consequence-box,.scene.inverted .consequence-box{border-left:none;border-radius:18px;padding:24px 26px;background:var(--blue-soft);}
  .scene.inverted .consequence-box{background:rgba(255,255,255,.07);}
  .consequence-box p{font-style:normal;font-family:inherit;font-size:17px;line-height:1.65;font-weight:500;}
  .defmoment .dwhy,.my-profile-impact,.mdconsequence{font-style:normal;font-family:inherit;}
  .fxline{border-left:none;padding-left:0;margin-top:22px;}
  .fxline p{color:var(--ink-soft);}
  .fxpills{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .fxpill{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:500;background:var(--paper-2);color:var(--ink);}
  .fxpill b{font-weight:700;}
  .fxpill.up{background:var(--mint);color:#000;}
  .fxpill.down{background:var(--blue-soft);color:var(--electric-blue);}
  .scene.inverted .fxpill{background:rgba(255,255,255,.1);color:#fff;}
  .scene.inverted .fxpill.up{background:var(--mint);color:#000;}
  .accent-note,.scene.inverted .accent-note{background:var(--blue-soft);color:var(--electric-blue);border-left:none;border-radius:999px;padding:9px 16px;text-transform:none;letter-spacing:.01em;font-size:13px;font-weight:500;}
  .scene.inverted .accent-note{background:rgba(255,255,255,.1);color:var(--mint);}

  /* state cards (report) */
  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px;}
  .sc{border-radius:18px;background:var(--paper-2);padding:18px 18px 20px;animation:rise 520ms backwards;animation-delay:calc(var(--i,0)*90ms + 150ms);}
  .sc-label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);min-height:2.6em;line-height:1.3;}
  .sc-word{font-size:23px;font-weight:700;margin-top:8px;letter-spacing:-.015em;}
  .sc-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;min-height:1.3em;}
  .sc-bar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);margin-top:14px;overflow:hidden;}
  .sc-bar i{display:block;height:100%;border-radius:99px;background:var(--electric-blue);transform-origin:left;animation:grow 900ms cubic-bezier(.2,.8,.2,1) backwards;}
  @keyframes grow{from{transform:scaleX(0);}}
  .radar-legend{min-width:220px;gap:14px;}
  .rlegend-item{display:block;font-size:13.5px;}
  .rlegend-item .rname{font-weight:500;margin-bottom:6px;}
  .rbar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;}
  .rbar i{display:block;height:100%;border-radius:99px;background:var(--electric-blue);transform-origin:left;animation:grow 900ms cubic-bezier(.2,.8,.2,1) backwards;}

  /* cards */
  .profile-card{border:1px solid var(--line-strong);border-radius:18px;background:#fff;box-shadow:var(--shadow);}
  .profile-card.active{background:var(--blue-soft);border-color:rgba(0,60,255,.35);}
  .profile-card.active::before{background:var(--electric-blue);color:#fff;border:none;border-radius:99px;padding:3px 10px;top:-11px;letter-spacing:.06em;}
  .skill,.skill:nth-child(n){background:#fff !important;border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow);}
  .skill::before{content:"";display:block;width:28px;height:6px;border-radius:99px;margin-bottom:14px;background:var(--electric-blue);}
  .skill:nth-child(2)::before{background:var(--mint);}
  .skill:nth-child(3)::before{background:var(--hot-pink);}
  .skill:nth-child(n) b{color:#000;}
  .skill:nth-child(n) span{color:var(--ink-soft);}
  .creator-view{border-radius:22px;}
  .creator-panel{border-left:none;border-radius:20px;}
  .decision-impact,.statgrid{border-radius:0;}
  .mcard{border-radius:18px;}

  /* icons : flat, soft tiles */
  .picon,.picon.big,.picon.city,.picon.sm{border:none;box-shadow:none;border-radius:18px;overflow:hidden;}
  .picon.profile{background:var(--pink-soft);}
  .picon.city{background:var(--blue-soft);}
  .picon.big{border-radius:26px;}
  .picon.sm{border-radius:12px;}
  .scene.inverted .picon.city{background:#fff;}
  .cityhero{margin-top:26px;}

  /* home colour strip : palette only */
  .geo{height:10px;max-width:300px;}
  .geo i{border-radius:99px;}
  .geo i:nth-child(1){background:var(--electric-blue);}
  .geo i:nth-child(2){background:var(--hot-pink);}
  .geo i:nth-child(3){background:#000;}
  .geo i:nth-child(4){background:var(--mint);}
  .geo i:nth-child(5){background:var(--electric-blue);}
  .geo i:nth-child(6){background:var(--hot-pink);}

  .site-credit{border-top-color:var(--line);}
  @media (max-width:640px){
    .scene::after{width:230px;height:230px;right:-115px;top:-115px;border:none;}
    .scene::before{display:block;width:180px;height:180px;left:-90px;bottom:-90px;}
    .scene.inverted::after,.scene.inverted::before{display:none;}
    .options .option{padding:16px 16px;grid-template-columns:32px 1fr;gap:12px;}
    .options .option:hover,.options .option:focus-visible{padding-left:16px;}
    .option .okey{width:30px;height:30px;font-size:14px;}
    .sgrid{gap:10px;}
    .sc{padding:16px 15px 18px;}
    .sc-word{font-size:20px;}
    .picon.big{width:72px !important;height:72px !important;}
    .btn.primary,.scene.inverted .btn.primary{box-shadow:0 8px 20px rgba(0,60,255,.22);}
    .scene.inverted .btn.primary{box-shadow:none;}
  }

  /* ---------- V6 : no dark screen, soft tinted background ---------- */
  html,body{height:auto;min-height:100%;}
  body{background:linear-gradient(160deg,rgba(0,60,255,.075) 0%,rgba(0,60,255,.025) 50%,rgba(255,0,153,.06) 100%) #fff;}
  .scene,.scene.turning{background:transparent;}

  /* turning point : same light page, marked with a soft pink accent */
  .scene.turning .kicker{display:inline-block;align-self:flex-start;background:var(--pink-soft);color:#000;padding:7px 15px;border-radius:99px;margin-bottom:16px;letter-spacing:.07em;}
  .scene.turning .kicker::before{width:8px;height:8px;border-radius:50%;background:var(--hot-pink);margin-right:9px;}
  .scene.turning .eyebrow-num{color:#000;}
  .scene.turning .option .okey{background:var(--pink-soft);color:#000;}
  .scene.turning .options .option:hover,.scene.turning .options .option:focus-visible{border-color:rgba(255,0,153,.5);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(255,0,153,.12);}
  .scene.turning .consequence-box{background:var(--pink-soft);}

  /* "My perspective" card : soft too */
  .creator-view{background:var(--blue-soft);border:1px solid rgba(0,60,255,.18);}
  .creator-view h3{color:#000;}
  .creator-view p{color:var(--ink-soft);}
  .creator-view .view-label,.creator-view .view-hint{color:var(--electric-blue);}
  .creator-view:hover,.creator-view:focus-visible{border-color:rgba(255,0,153,.5);}

  .pcrit{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-strong);}
  .pcrit-label{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);}
  .pcrit-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hot-pink);}
  .pcrit p{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-top:6px;}
  a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;}
  .cardprev{display:block;width:100%;max-width:340px;border-radius:18px;box-shadow:var(--shadow);margin-top:20px;}
  .cardhint{font-size:13px;color:var(--ink-soft);margin-top:10px;max-width:340px;}
  .credit-built{margin-top:12px;font-size:11px;letter-spacing:.05em;color:var(--ink-soft);}
  .btn.primary:hover,.btn.primary:focus-visible{background:var(--electric-blue);border-color:var(--electric-blue);transform:translateY(1px);box-shadow:0 3px 10px rgba(0,60,255,.3);}

  /* ---------- V7 : neutral dotted background + full-page geometric shapes (never clipped) ---------- */
  body{background-color:#f7f7f7;background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.4px);background-size:26px 26px;}
  .scene::before,.scene::after{display:none !important;}
  #app,.site-credit{position:relative;z-index:1;}
  #bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  #bg i{position:absolute;display:block;aspect-ratio:1;}
  #bg .s1{left:3%;top:14%;width:clamp(70px,10vw,170px);border-radius:28%;background:rgba(0,60,255,.09);transform:rotate(14deg);}
  #bg .s2{right:4%;top:30%;width:clamp(60px,8vw,130px);border-radius:50%;border:clamp(10px,1.4vw,22px) solid rgba(255,0,153,.15);box-sizing:border-box;}
  #bg .s3{left:6%;bottom:10%;width:clamp(60px,8vw,130px);background:rgba(142,255,144,.45);border-radius:100% 0 0 0;}
  #bg .s4{right:7%;bottom:8%;width:clamp(60px,8vw,130px);background:rgba(0,60,255,.1);clip-path:polygon(50% 0,100% 100%,0 100%);}
  #bg .s5{right:13%;top:9%;width:clamp(28px,3.6vw,56px);border-radius:50%;background:rgba(255,0,153,.18);}
  #bg .s6{left:15%;top:54%;width:clamp(34px,4.4vw,70px);border:clamp(5px,.6vw,9px) solid rgba(0,60,255,.14);border-radius:6px;transform:rotate(45deg);box-sizing:border-box;}
  @media (max-width:1000px){#bg{display:none;}}
  /* V8 : blue / pink alternate every other decision */
  .scene.turning .kicker{background:var(--blue-soft);}
  .scene.turning .kicker::before{background:var(--electric-blue);}
  .scene.turning .option .okey{background:var(--blue-soft);color:var(--electric-blue);}
  .scene.turning .options .option:hover,.scene.turning .options .option:focus-visible{border-color:rgba(0,60,255,.45);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(0,60,255,.12);}
  .scene.turning .consequence-box{background:var(--blue-soft);}
  .scene.pink .kicker{background:var(--pink-soft);}
  .scene.pink .kicker::before{background:var(--hot-pink);}
  .scene.pink .option .okey{background:var(--pink-soft);color:#000;}
  .scene.pink .options .option:hover,.scene.pink .options .option:focus-visible{border-color:rgba(255,0,153,.5);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(255,0,153,.12);}
  .scene.pink .consequence-box{background:var(--pink-soft);}
  .scene.pink .eyebrow-num{color:#000;}
  .cardprev{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;max-width:360px;}
  .cardhint.big{font-size:15px;font-weight:600;color:#000;background:var(--blue-soft);padding:12px 16px;border-radius:14px;max-width:360px;}
  .poster-wrap{margin:30px 0 8px;max-width:380px;}
  .cityposter{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 44px rgba(0,0,0,.10);background:#fff;}
  /* V9 : simpler look, dotted background kept, no decorative shapes */
  #bg{display:none !important;}
  html,body{background-color:#f7f7f7 !important;background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.4px) !important;background-size:26px 26px !important;}
  .scene::before,.scene::after{display:none !important;}
</style>

   ["This project is my way","Ce projet est ma façon de montrer comment je pense ce métier. Plutôt que de lister des compétences dans un CV, j’ai construit une courte simulation : vous dirigez un musée d’art contemporain pendant un an et affrontez neuf décisions. À la fin, vous obtenez un profil de gestion, que vous pouvez comparer à mes propres choix."],

I18N.fr.DEC={"rights": ["À qui appartient la Ville ?", "THE CITY comprend des façades reconstituées, des éléments graphiques et des objets inspirés de l’architecture moderniste. Un artiste dont l’œuvre est visiblement citée estime que l’installation emprunte de trop près à son langage visuel. L’équipe curatoriale répond qu’il s’agit d’une réinterprétation contemporaine, non d’une reproduction.", ["Maintenir l’œuvre telle que prévue", "Défendre l’interprétation artistique et accepter l’incertitude juridique.", "L’installation reste. L’artiste critique publiquement le HÜS, mais l’exposition ouvre exactement comme les commissaires l’avaient voulu."], ["Commander un avis juridique et adapter si besoin", "Protéger le projet tout en offrant aux inquiétudes de l’artiste une écoute formelle.", "Quelques éléments sont redessinés avant l’ouverture. Le risque juridique baisse, et l’exposition garde son idée d’origine."], ["Retirer les éléments contestés", "Choisir la voie la plus sûre et reconstruire la section de zéro.", "Les références contestées disparaissent. Le musée évite l’escalade, mais l’équipe curatoriale sent qu’une partie de l’exposition a perdu son tranchant."]], "performers": ["Celles et ceux qui habitent ici", "Les performeurs sont au cœur de THE CITY. Ils ne sont pas de simples guides : ils jouent des habitants, des commerçants et des usagers du quotidien selon une partition souple. Après plusieurs mois, certains demandent des conditions de travail plus claires, des temps de repos et un statut plus formel.", ["Professionnaliser l’équipe de performeurs", "Augmenter contrats, formation et coûts de personnel pour stabiliser le projet.", "Les performeurs obtiennent des conditions plus claires et la ville gagne en cohérence. Votre budget de production en fait les frais."], ["Garder le modèle souple", "Préserver le format d’origine et traiter les problèmes au cas par cas.", "La ville garde son énergie imprévisible. Mais les désaccords sur les conditions de travail deviennent plus difficiles à ignorer."], ["Repenser le format autour de performances programmées", "Réduire les heures en direct et rendre le rôle plus clairement performatif.", "La distinction entre performeur et visiteur devient plus nette. THE CITY ressemble un peu moins à une vraie ville, et se gère plus facilement."]], "access": ["Une Ville pour qui ?", "Les visiteurs adorent l’échelle de THE CITY, mais des associations locales soulignent que l’expérience a été pensée pour des personnes déjà à l’aise avec l’art contemporain. Familles, adolescents et visiteurs en situation de handicap demandent des parcours plus clairs, des activités accessibles et un tarif d’entrée plus abordable.", ["Ouvrir la ville aux habitants", "Journées gratuites pour les riverains, ateliers de quartier et programmation portée par la communauté.", "Le musée se remplit nettement d’habitants. Certains habitués se plaignent que l’ambiance a changé, d’autres sentent enfin que le HÜS est aussi à eux."], ["Construire un solide programme de médiation", "Garder les tarifs mais investir fortement dans les guides, les écoles et une interprétation accessible.", "Les groupes scolaires et les primo-visiteurs deviennent une part visible de l’exposition. La ville commence à être lue plutôt que simplement photographiée."], ["Cibler les visiteurs internationaux", "Protéger les recettes et utiliser l’identité visuelle de l’exposition pour attirer les touristes.", "La fréquentation grimpe en haute saison touristique. Le HÜS gagne en visibilité nationale, tandis que le quartier reste sous-représenté."]], "image-rights": ["La Ville vous regarde", "Les visiteurs peuvent filmer à l’intérieur de THE CITY. Une performeuse découvre que son image circule dans une vidéo virale tournée pendant une scène qu’elle était payée pour jouer. Elle demande au HÜS d’intervenir. L’équipe communication rappelle que les contenus des visiteurs sont essentiels à la visibilité de l’exposition.", ["Restreindre le tournage dans les zones des performeurs", "Donner la priorité au consentement et au contrôle des performeurs sur leur image.", "Le musée instaure des zones sans tournage clairement signalées. La portée auprès des publics baisse légèrement, mais les performeurs se sentent plus en sécurité."], ["Créer un système de consentement et de crédit", "Autoriser le tournage selon des règles visibles, avec identification volontaire des performeurs et procédure de signalement.", "Le dispositif est plus complexe, mais les visiteurs comprennent les règles et le musée conserve l’essentiel de la circulation numérique de l’exposition."], ["Laisser le tournage libre", "Traiter la ville comme un environnement d’apparence publique et s’appuyer sur les affichages existants.", "THE CITY devient très partageable. Une plainte oblige ensuite le HÜS à expliquer ce que le consentement signifie dans un espace public fictif."]], "sponsor": ["Une marque dans la Ville", "Six mois avant la fin de l’exposition, un grand groupe français de mobilité propose 180 000 € pour financer la prolongation de THE CITY. En échange, il souhaite qu’une des rues centrales porte le nom de sa marque pendant les trois derniers mois.", ["Accepter le naming", "Sécuriser le financement et laisser la marque s’intégrer à la ville.", "L’argent garantit la prolongation. La rue sponsorisée devient vite l’un des lieux les plus photographiés de THE CITY, pour des raisons que les commissaires n’avaient pas voulues."], ["Négocier un partenariat discret", "Garder le financement mais retirer la condition du naming.", "L’entreprise accepte un partenariat discret. L’exposition traverse la prolongation sans modifier son paysage urbain fictif."], ["Refuser l’offre", "Protéger l’exposition de l’influence commerciale et trouver un autre financement.", "La marque disparaît de la conversation. Votre directeur financier a désormais trois mois pour trouver ailleurs les 180 000 € manquants."]], "controversy": ["Le bâtiment controversé", "Une enquête de presse révèle qu’un des bâtiments recréés dans THE CITY s’inspire d’un ensemble de logements modernistes controversé. D’anciens habitants décrivent l’architecture d’origine comme à la fois visionnaire et oppressante. L’affaire change la lecture de l’exposition par les visiteurs, et le conseil d’administration demande si le HÜS doit intervenir.", ["Laisser l’œuvre parler d’elle-même", "Protéger l’autonomie de l’artiste et éviter de réécrire l’exposition après une critique.", "Le musée refuse de retirer le bâtiment. Le débat s’intensifie et la section controversée devient l’un des espaces les plus discutés de l’exposition."], ["Ajouter une couche historique critique", "Garder l’installation mais introduire témoignages, archives et débat public.", "Le bâtiment reste, mais son histoire fait désormais partie de l’interprétation de l’œuvre. La conversation publique gagne en nuance."], ["Retirer le bâtiment", "Éviter de nouveaux torts et protéger le HÜS d’une polémique grandissante.", "La section est démontée en une nuit. Le musée est salué par les uns et accusé de censure par les autres."]], "technology": ["Une couche numérique", "Une entreprise de technologies immersives propose d’ajouter une couche numérique à THE CITY : les visiteurs pourraient voir, sur leur téléphone, les infrastructures invisibles, des récits personnels et des versions alternatives de la ville. Le service est gratuit, mais l’entreprise veut accéder à des données anonymisées sur le comportement des visiteurs.", ["Accepter le partenariat complet", "Ajouter une dimension numérique majeure sans augmenter le budget de l’exposition.", "La ville numérique attire un public plus jeune et une forte attention en ligne. Votre conseiller juridique demande pourquoi le contrat donne autant de données à l’entreprise."], ["Lancer un pilote limité", "Une seule zone, des limites strictes sur les données et des analyses contrôlées par le musée.", "Le pilote prouve l’idée sans céder le contrôle. L’entreprise réclame un engagement const sgn = v => v>0 ? "+" : v<0 ? "−" : "±";
const METRICS = [
  { id:"budget", label:"Remaining budget",        fmt:v=>(v<0?"−":"")+"€"+(Math.abs(v)/1000).toFixed(2)+"M", dfmt:d=>sgn(d)+"€"+Math.abs(Math.round(d))+"k", pct:v=>clamp(v/1400*100) },
  { id:"att",    label:"Attendance vs last year", fmt:v=>sgn(Math.round(v)).replace("±","")+Math.abs(Math.round(v))+"%", dfmt:d=>sgn(d)+Math.abs(Math.round(d))+" pts", pct:v=>clamp((v+20)/60*100) },
  { id:"art",    label:"Artist relations",        fmt:v=>Math.round(v)+"/100", dfmt:d=>sgn(d)+Math.abs(Math.round(d))+" pts", pct:v=>v },
  { id:"trust",  label:"Public trust",            fmt:v=>Math.round(v)+"/100", dfmt:d=>sgn(d)+Math.abs(Math.round(d))+" pts", pct:v=>v },
];

function metricCardsHtml(before, after){
  return `<div class="mgrid">` + METRICS.map((m,i)=>{
    const d = after[m.id]-before[m.id];
    const cls = d>0 ? "up" : d<0 ? "down" : "flat";
    return `<div class="mcard ${cls}" style="--i:${i}" data-id="${m.id}" data-from="${before[m.id]}" data-to="${after[m.id]}">
      <div class="mlabel">${m.label}</div>
      <div class="mval mono">${m.fmt(after[m.id])}</div>
      <div class="mdelta mono">${m.dfmt(d)}</div>
      <div class="mbar"><i style="width:${m.pct(after[m.id])}%"></i></div>
    </div>`;
  }).join("") + `</div>`;
}

function animateMetrics(root){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.querySelectorAll(".mcard:not(.done)").forEach(card=>{
    if(card.closest("[hidden]")) return;
    card.classList.add("done");
    const m = METRICS.find(x=>x.id===card.dataset.id);
    const from = +card.dataset.from, to = +card.dataset.to;
    if(reduce || from===to) return;
    const val = card.querySelector(".mval"), bar = card.querySelector(".mbar i");
    bar.style.transition = "none"; bar.style.width = m.pct(from)+"%";
    val.textContent = m.fmt(from);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      bar.style.transition = ""; bar.style.width = m.pct(to)+"%";
      const t0 = performance.now(), dur = 900;
      (function tick(t){
        const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
        val.textContent = m.fmt(from+(to-from)*e);
        if(p<1) requestAnimationFrame(tick); else val.textContent = m.fmt(to);
      })(t0);
    }));
  });
}

/* ---- consequence pills + report state cards ---- */
function fxPillsHtml(fx){
  const items = [];
  if(fx.b) items.push({ k:"Budget", v:(fx.b>0?"+":"−")+"€"+Math.abs(fx.b)+"k", d:fx.b, w:Math.abs(fx.b)/12 });
  [["Attendance","a",3],["Artists","r",4],["Public trust","t",4]].forEach(([label,key,th])=>{
    const x = fx[key];
    if(Math.abs(x) >= th) items.push({ k:label, v:Math.abs(x)>=8 ? (x>0?"↑↑":"↓↓") : (x>0?"↑":"↓"), d:x, w:Math.abs(x)*2 });
  });
  items.sort((p,q)=>q.w-p.w);
  if(!items.length) return "";
  return `<div class="fxpills">` + items.slice(0,3).map(i=>`<span class="fxpill ${i.d>0?'up':'down'}"><span>${i.k}</span><b>${i.v}</b></span>`).join("") + `</div>`;
}
const STATE_DEF = [
  { id:"budget", label:"Remaining budget",        t:[1250,1100,900], w:["Comfortable","Balanced","Tight","In the red"] },
  { id:"att",    label:"Attendance vs last year", t:[20,10,3],       w:["Booming","Growing","Steady","Declining"] },
  { id:"art",    label:"Artist relations",        t:[70,55,40],      w:["Strong","Good","Tense","Broken"] },
  { id:"trust",  label:"Public trust",            t:[70,55,40],      w:["High","Solid","Fragile","Low"] },
];
const stateWord = (d,v)=> v>=d.t[0] ? d.w[0] : v>=d.t[1] ? d.w[1] : v>=d.t[2] ? d.w[2] : d.w[3];
function stateCardsHtml(m, mode="end"){
  return `<div class="sgrid">` + STATE_DEF.map((d,i)=>{
    const met = METRICS.find(x=>x.id===d.id);
    const word = stateWord(d, m[d.id]);
    let sub;
    if(mode==="start") sub = (d.id==="budget"||d.id==="att") ? `<span>${met.fmt(m[d.id])}</span>` : "";
    else if(d.id==="budget") sub = `<span>${met.fmt(m[d.id])}</span> <span>·</span> <span>Started at</span> <span>${met.fmt(METRIC_START[d.id])}</span>`;
    else sub = `<span>Started at</span> <span>${stateWord(d, METRIC_START[d.id])}</span>`;
    return `<div class="sc" style="--i:${i}"><div class="sc-label">${d.label}</div><div class="sc-word">${word}</div><div class="sc-sub">${sub}</div><div class="sc-bar"><i style="width:${met.pct(m[d.id])}%"></i></div></div>`;
  }).join("") + `</div>`;
}

  return `<span class="picon ${cls}" style="width:${size}px;height:${size}px;"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">${inner}</svg></span>`;
}
const LN = `stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
const LN2 = `stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"`;
function profileIcon(key, size=56, big=false, block=false){
  const {B,P,G,I,D} = IC;
  const art = {
    economic:`<rect x="8" y="36" width="13" height="20" rx="3" fill="${B}"/><rect x="25.5" y="24" width="13" height="32" rx="3" fill="${I}"/><rect x="43" y="12" width="13" height="44" rx="3" fill="${P}"/>`,
    artistic:`<rect x="10" y="12" width="44" height="40" rx="6" fill="none" ${LN}/><circle cx="26" cy="28" r="6" fill="${P}"/><path d="M18 46 L34 30 L46 46 Z" fill="${B}"/>`,
    legal:`<line x1="32" y1="10" x2="32" y2="54" ${LN}/><line x1="14" y1="20" x2="50" y2="20" ${LN}/><line x1="14" y1="20" x2="14" y2="38" ${LN2}/><line x1="50" y1="20" x2="50" y2="38" ${LN2}/><path d="M4 38 a10 10 0 0 0 20 0 Z" fill="${B}"/><path d="M40 38 a10 10 0 0 0 20 0 Z" fill="${P}"/>`,
    social:`<line x1="32" y1="16" x2="14" y2="46" ${LN2}/><line x1="32" y1="16" x2="50" y2="46" ${LN2}/><line x1="14" y1="46" x2="50" y2="46" ${LN2}/><circle cx="32" cy="16" r="9" fill="${P}"/><circle cx="14" cy="46" r="9" fill="${B}"/><circle cx="50" cy="46" r="9" fill="${G}"/>`,
    innovation:`<polygon points="37,4 14,36 29,36 25,60 50,26 35,26" fill="${P}" stroke="${P}" stroke-width="2" stroke-linejoin="round"/>`,
    reputation:`<circle cx="24" cy="32" r="16" fill="${B}"/><circle cx="41" cy="32" r="16" fill="${P}"/>`,
  }[key] || "";
  return iconTile(art, size, "profile" + (big?" big":"") + (block?" block":""));
}

/* ---- THE CITY series: one small, simple illustration per decision ---- */
function cityIcon(id, size=64, small=false){
  const {B,P,G,I,D} = IC;
  const win = (x,y)=>`<rect x="${x}" y="${y}" width="6" height="6" rx="1.5" fill="${D}"/>`;
  const art = {
    "rights":`<rect x="12" y="14" width="28" height="42" rx="4" fill="${B}"/>${win(19,22)}${win(29,22)}${win(19,34)}${win(29,34)}<rect x="24" y="24" width="30" height="34" rx="4" fill="none" stroke="${P}" stroke-width="3" stroke-dasharray="5 4"/>`,
    "performers":`<circle cx="22" cy="18" r="7" fill="${P}"/><rect x="14" y="28" width="16" height="28" rx="8" fill="${P}"/><circle cx="44" cy="26" r="6" fill="${B}"/><rect x="37" y="34" width="14" height="22" rx="7" fill="${B}"/>`,
    "access":`<path d="M12 56 V30 a14 14 0 0 1 28 0 V56" fill="none" ${LN}/><circle cx="26" cy="40" r="5" fill="${P}"/><path d="M42 56 H58 V44 Z" fill="${G}"/>`,
    "image-rights":`<path d="M4 32 Q32 8 60 32 Q32 56 4 32 Z" fill="none" ${LN}/><circle cx="32" cy="32" r="9" fill="${B}"/>`,
    "sponsor":`<rect x="8" y="10" width="48" height="26" rx="6" fill="${P}"/><circle cx="32" cy="23" r="7" fill="${D}"/><line x1="32" y1="36" x2="32" y2="56" ${LN}/>`,
    "controversy":`<rect x="12" y="10" width="30" height="46" rx="4" fill="${B}"/>${win(18,18)}${win(28,18)}${win(18,30)}${win(28,30)}<path d="M42 10 L34 24 L44 32 L36 56" fill="none" stroke="${P}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`,
    "technology":`<polygon points="6,44 32,32 58,44 32,56" fill="${B}"/><polygon points="6,32 32,20 58,32 32,44" fill="${G}"/><polygon points="6,20 32,8 58,20 32,32" fill="${P}"/>`,
    "ownership":`<rect x="8" y="10" width="24" height="22" rx="4" fill="${G}" transform="rotate(-8 20 21)"/><rect x="34" y="14" width="22" height="22" rx="4" fill="${P}" transform="rotate(7 45 25)"/><rect x="18" y="34" width="26" height="22" rx="4" fill="${B}" transform="rotate(-3 31 45)"/>`,
    "legacy":`<rect x="8" y="8" width="48" height="44" rx="4" fill="none" stroke="${I}" stroke-width="2.5" stroke-dasharray="4 4"/><rect x="8" y="28" width="26" height="24" rx="3" fill="${B}"/><line x1="4" y1="57" x2="60" y2="57" ${LN}/>`,
  }[id] || "";
  return iconTile(art, size, "city" + (small?" sm":""));
}

function cityHero(){
  const {B,P,G,I,D} = IC;
  const bl = [ [10,52,44,60,B],[58,28,36,84,I],[98,66,50,46,P],[152,40,40,72,G],[196,62,34,50,"#ececec"],[234,20,44,92,B],[282,54,64,58,I] ];
  let out = "";
  bl.forEach(([x,y,w,h,f])=>{
    out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${f}"/>`;
    const cols = Math.floor((w-8)/14), rows = Math.floor((h-12)/22);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      out += `<rect x="${x+8+c*14}" y="${y+10+r*22}" width="6" height="9" rx="2" fill="${D}"/>`;
  });
  out += `<circle cx="326" cy="18" r="11" fill="${P}"/>`;
  out += `<line x1="0" y1="113" x2="360" y2="113" ${LN}/>`;
  return `<svg class="cityhero" viewBox="0 0 360 120" role="img" aria-label="THE CITY">${out}</svg>`;
}

/* ============================= HELPERS ============================= */

function clamp(v){ return Math.max(0, Math.min(100, v)); }

function applyDeltas(deltas){
  for(const k in deltas){ state.values[k] = clamp(state.values[k] + deltas[k]); }
}

function tagFor(key, delta, showNumber=false){
  const meta = VALUE_META[key];
  const dir = delta > 0 ? "up" : "down";
  const arrow = delta > 0 ? (delta>=12 ? "\u2191\u2191" : "\u2191") : (delta<=-12 ? "\u2193\u2193" : "\u2193");
  const amount = showNumber ? ` ${delta > 0 ? "+" : ""}${delta}` : "";
  return `<span class="tag ${dir}" title="${meta.label}: ${delta > 0 ? "+" : ""}${delta}">${meta.label} ${arrow}${amount}</span>`;
}

function renderValueBar(){
  valuebar.innerHTML = VALUE_KEYS.map(k=>{
    const meta = VALUE_META[k];
    const v = state.values[k];
    return `<div class="vitem">
      <div class="vlabel">${meta.label}</div>
      <div class="vtrack"><div class="vfill" style="width:${v}%; background:${meta.hex};"></div></div>
      <div class="vnum mono">${v}</div>
    </div>`;
  }).join("");
}

function setScreen(html, opts={}){
  app.innerHTML = `<div class="scene ${opts.inverted?'inverted':''} ${opts.turning?'turning':''} ${opts.pink?'pink':''}">${html}</div>`;
  document.body.classList.toggle("inv", !!opts.inverted);
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  applyLang();
}

  updateSeg(state.step, state.step);

function choose(stepIdx, key){
  const d = DECISIONS[stepIdx];
  const o = d.options.find(x=>x.key===key);
  const before = { ...state.metrics };
  applyDeltas(o.deltas);
  state.metrics = applyFx(state.metrics, o.fx);
  state.history.push({ id:d.id, title:d.title, choiceKey:key, label:o.label, deltas:o.deltas });
  renderValueBar();
  showConsequence(d, o, before);
}

// Maïa's own choices for each decision, used to compute her profile in "My Perspective"
const MY_CHOICES = {
  "rights":"B",
  "performers":"A",
  "access":"B",
  "image-rights":"B",
  "sponsor":"B",
  "controversy":"B",
  "technology":"B",
  "ownership":"A",
  "legacy":"C",
};

function computeMyPerspective(){
  const values = { economic:50, artistic:50, legal:50, social:50, innovation:50, reputation:50 };
  let mm = { ...METRIC_START };
  const choices = DECISIONS.map(d=>{
    const key = MY_CHOICES[d.id];
    const opt = d.options.find(o=>o.key===key);
    for(const k in opt.deltas){ values[k] = clamp(values[k] + opt.deltas[k]); }
    mm = applyFx(mm, opt.fx);
    return { id:d.id, title:d.title, key, label:opt.label, consequence:opt.consequence, fx:opt.fx.en };
  });
  const ranked = PRIMARY_KEYS.map(k=>({k, v:values[k]})).sort((a,b)=>b.v-a.v);
  const top = ranked[0];
  const sortedVals = VALUE_KEYS.map(k=>({k, v:values[k]})).sort((a,b)=>b.v-a.v);
  const highs = sortedVals.slice(0,2);
  const low = sortedVals[sortedVals.length-1];
  const impact = `My institution became ${highs.map(h=>VALUE_META[h.k].high).join(" and ")}, but it remains ${VALUE_META[low.k].low}.`;
  const selfDesc = PROFILES[top.k].desc
    .replace(/\bYour\b/g, "My").replace(/\byour\b/g, "my")
    .replace(/\bYou\b/g, "I").replace(/\byou\b/g, "I");
  return { values, choices, metrics:mm, profile:{ key:top.k, ...PROFILES[top.k], desc:selfDesc }, impact };
}

function computeProfile(){
  const ranked = PRIMARY_KEYS.map(k=>({k, v:state.values[k]})).sort((a,b)=>b.v-a.v);
  const top = ranked[0], second = ranked[1], bottom = ranked[ranked.length-1];

  return {
    key:top.k,
    ...PROFILES[top.k],
    top:top.k,
    second:second.k,
    bottom:bottom.k,
    emergent:true
  };
}

function impactSentence(profile){
  const sorted = VALUE_KEYS.map(k=>({k, v:state.values[k]})).sort((a,b)=>b.v-a.v);
  const highs = sorted.slice(0,2);
  const low = sorted[sorted.length-1];
  const highText = highs.map(h=>VALUE_META[h.k].high).join(", and also ");
  const lowText = VALUE_META[low.k].low;
  return `Your institution became ${highText}, but it remains ${lowText}.`;
}

function definingMoments(profile){
  const focusKeys = [profile.top, profile.second];
  const scored = state.history.map(h=>{
    let score = 0;
    for(const k of focusKeys){ score += Math.abs(h.deltas[k]||0) * (k===profile.top?2:1); }
    for(const k in h.deltas){ if(!focusKeys.includes(k)) score += Math.abs(h.deltas[k])*0.2; }
    return {...h, score};
  }).sort((a,b)=>b.score-a.score).slice(0,3);
  return scored;
}

function radarSVG(){
  const W = 460, H = 380, cx = W/2, cy = H/2 + 4, R = 118;
  const n = VALUE_KEYS.length;
  const angle = (i)=> (Math.PI*2*i/n) - Math.PI/2;
  const pt = (i, r)=>{ const a = angle(i); return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };

  let rings = "";
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts = VALUE_KEYS.map((_,i)=>pt(i, R*f).join(",")).join(" ");
    rings += `<polygon points="${pts}" fill="none" stroke="rgba(0,0,0,${f===1?0.22:0.1})" stroke-width="1"/>`;
  });
  let axes = "";
  VALUE_KEYS.forEach((_,i)=>{
    const [x,y] = pt(i, R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>`;
  });
  const dataPts = VALUE_KEYS.map((k,i)=> pt(i, R * (state.values[k]/100)).join(",")).join(" ");
  const dots = VALUE_KEYS.map((k,i)=>{
    const [x,y] = pt(i, R * (state.values[k]/100));
    return `<circle cx="${x}" cy="${y}" r="5" fill="#ff0099" stroke="#fff" stroke-width="2"/>`;
  }).join("");
  let labels = "";
  VALUE_KEYS.forEach((k,i)=>{
    const [x,y] = pt(i, R + 16);
    const anchor = x > cx + 6 ? "start" : x < cx - 6 ? "end" : "middle";
    const dy = Math.abs(x-cx) <= 6 ? (y < cy ? -6 : 14) : 4;
    labels += `<text x="${x}" y="${y+dy}" text-anchor="${anchor}" font-family="DM Sans, sans-serif" font-size="13" fill="rgba(0,0,0,.7)">${VALUE_META[k].label}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar" style="width:100%;height:auto;transform-origin:50% 50%;animation:radarIn 900ms cubic-bezier(.2,.8,.2,1);">
    <style>@keyframes radarIn{from{opacity:0; transform:scale(.88);} to{opacity:1; transform:scale(1);}}</style>
    ${rings}${axes}
    <polygon points="${dataPts}" fill="rgba(0,60,255,0.12)" stroke="#003cff" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

  if(box){
    box.innerHTML = `<img class="cardprev" src="${dataUrl || href}" alt="">
      <p class="cardhint big">Press and hold the image to save it to your photos.</p>
      <div class="btn-row" style="margin-top:14px;"><a class="btn" href="${href}" download="HUS-profile-card.png">Download the image</a><a class="btn" href="${href}" target="_blank" rel="noopener noreferrer">Open the image</a>${canShare ? '<button class="btn" onclick="shareCard()">Share</button>' : ''}</div>`;
    applyLang();
    try{ box.scrollIntoView({ behavior:"smooth", block:"nearest" }); }catch(e){}
  }
}

function restart(){
  state = {
    screen:"intro", step:0,
    values:{ economic:50, artistic:50, legal:50, social:50, innovation:50, reputation:50 },
    metrics:{ ...METRIC_START },
    history:[], pendingConsequence:null,
  };
  screenIntro();
}
